<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdfa"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="chunkyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#121316" flood-opacity="0.95"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Card / squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#121316" stroke-width="14"/>

  <!-- Subtle playful background dots -->
  <circle cx="80" cy="90" r="5" fill="#f97316" opacity="0.7"/>
  <circle cx="430" cy="110" r="6" fill="#4f46e5" opacity="0.6"/>
  <circle cx="440" cy="380" r="5" fill="#10b981" opacity="0.6"/>
  <circle cx="75" cy="370" r="6" fill="#f97316" opacity="0.6"/>

  <!-- Speed sparkles in air -->
  <path d="M 115 155 L 125 155 M 120 150 L 120 160" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <path d="M 390 145 L 406 145 M 398 137 L 398 153" stroke="#4f46e5" stroke-width="5" stroke-linecap="round"/>
  <path d="M 360 90 L 370 90 M 365 85 L 365 95" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

  <!-- Back Photo Card (tilted left) -->
  <g transform="translate(190, 195) rotate(-14) translate(-90, -110)">
    <rect x="0" y="0" width="130" height="155" rx="14" fill="#ffffff" stroke="#121316" stroke-width="8" filter="url(#chunkyShadow)"/>
    <rect x="14" y="14" width="102" height="96" rx="8" fill="#e0e7ff"/>
    <!-- Photo inner art: mountains & sun -->
    <circle cx="75" cy="45" r="16" fill="url(#sunGrad)"/>
    <path d="M 18 100 L 48 55 L 78 100 Z" fill="#6366f1"/>
    <path d="M 52 100 L 78 68 L 112 100 Z" fill="#818cf8"/>
  </g>

  <!-- Front Photo Card (tilted right) -->
  <g transform="translate(295, 190) rotate(11) translate(-80, -105)">
    <rect x="0" y="0" width="135" height="160" rx="14" fill="#ffffff" stroke="#121316" stroke-width="8" filter="url(#chunkyShadow)"/>
    <rect x="14" y="14" width="107" height="102" rx="8" fill="url(#photoGrad)"/>
    <!-- Photo inner art: video / play camera shutter -->
    <circle cx="67" cy="65" r="26" fill="#ea580c"/>
    <polygon points="61,51 81,65 61,79" fill="#ffffff"/>
  </g>

  <!-- Wireless / Instant Air Leap Flash between cards -->
  <path d="M 235 150 Q 256 125 275 148" fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>
  <polygon points="256,110 244,136 258,136 248,162 272,130 258,130" fill="#facc15" stroke="#121316" stroke-width="5" stroke-linejoin="round"/>

  <!-- The Ferry Boat -->
  <g>
    <!-- Cabin Structure -->
    <rect x="200" y="250" width="112" height="52" rx="10" fill="#ffffff" stroke="#121316" stroke-width="9"/>
    <!-- Cabin Windows -->
    <rect x="216" y="264" width="22" height="22" rx="5" fill="#38bdf8" stroke="#121316" stroke-width="5"/>
    <rect x="245" y="264" width="22" height="22" rx="5" fill="#38bdf8" stroke="#121316" stroke-width="5"/>
    <rect x="274" y="264" width="22" height="22" rx="5" fill="#38bdf8" stroke="#121316" stroke-width="5"/>

    <!-- Ferry Smoke Funnel -->
    <path d="M 282 225 L 298 225 L 294 250 L 278 250 Z" fill="#f97316" stroke="#121316" stroke-width="7" stroke-linejoin="round"/>
    <line x1="280" y1="233" x2="296" y2="233" stroke="#121316" stroke-width="4"/>

    <!-- Funnel Puff steam -->
    <circle cx="295" cy="210" r="7" fill="#e2e8f0" stroke="#121316" stroke-width="4"/>
    <circle cx="312" cy="198" r="10" fill="#e2e8f0" stroke="#121316" stroke-width="4"/>

    <!-- Main Ferry Hull with bold 3D bottom shadow -->
    <!-- Drop shadow faux -->
    <path d="M 105 320 L 140 375 L 372 375 L 407 320 Z" fill="#121316"/>
    <!-- Hull body -->
    <path d="M 100 310 L 138 368 L 374 368 L 412 310 Z" fill="url(#hullGrad)" stroke="#121316" stroke-width="9" stroke-linejoin="round"/>
    <!-- Tangerine Hull Racing Stripe -->
    <path d="M 112 326 L 126 346 L 386 346 L 400 326 Z" fill="#f97316" stroke="#121316" stroke-width="5" stroke-linejoin="round"/>

    <!-- Bow lifebuoy -->
    <circle cx="160" cy="336" r="12" fill="#ffffff" stroke="#121316" stroke-width="4"/>
    <circle cx="160" cy="336" r="6" fill="#f97316"/>
  </g>

  <!-- Waves -->
  <!-- Back wave -->
  <path d="M 70 380 Q 120 360 170 380 T 270 380 T 370 380 T 450 380" fill="none" stroke="#0284c7" stroke-width="12" stroke-linecap="round"/>
  <!-- Front playful splash wave -->
  <path d="M 85 410 Q 140 385 195 410 T 305 410 T 415 410 T 445 405" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>
  <!-- Front white wave crests -->
  <path d="M 110 428 Q 165 412 220 428 T 330 428 T 425 425" fill="none" stroke="#121316" stroke-width="8" stroke-linecap="round"/>
</svg>
